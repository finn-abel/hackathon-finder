[project]
name = "hackathon-finder"
version = "0.1.0"
description = "A programmatic fuzzy-criteria screener for hackathons, GTA-first."
requires-python = ">=3.11"
dependencies = [
    "browser-use>=0.13.10",
    "python-dateutil>=2.9.0.post0",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "steel-sdk>=0.19.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
