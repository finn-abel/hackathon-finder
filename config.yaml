# How the screener runs. Everything here is a parameter — nothing downstream
# is hard-coded. Command-line flags override any of it.

# "gta"     — screen the Greater Toronto Area (the default). `location` is ignored.
# "general" — screen the area named in `location`.
mode: gta

# Required in "general" mode, ignored in "gta" mode.
location: null

# The one sentence the AI judges each listing against. This is the only
# fuzzy input in the whole config.
criteria: "beginner-friendly, in-person, open to non-students, AI or web themed"

# Deterministic filters — applied by code, never by the LLM.
filters:
  timeframe_months: 3   # only events starting within the next N months
  include_past: false   # keep events that have already happened
  format: any           # in-person | online | hybrid | any
  themes: []            # e.g. ["ai", "web"] — empty means no theme filter

# How wide to cast the net when gathering candidates.
collect:
  sources: [devpost, mlh]   # which sources to gather from
  search_terms: []   # empty = derived from mode (GTA municipalities, or your location)
  max_scrolls: 3     # Devpost infinite-scrolls; how many times to scroll for more

# How the AI reads a detail page (extraction only — it never judges).
read:
  model: gpt-4.1-mini
  max_steps: 15
  timeout_s: 240      # give up on one listing after this long and move on

# How the AI scores fit. It never decides location or deadlines.
judge:
  model: gpt-4.1-mini
  concurrency: 5
